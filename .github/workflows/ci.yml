name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev,api]"
      - run: ruff check src tests
      - run: pytest -q --cov=tariffpilot --cov-fail-under=80
      - name: Eval regression gate (offline, zero quota)
        run: python -m tariffpilot eval --split test --system both --gate
      - name: Audit chain sanity
        run: python -m tariffpilot verify-audit
